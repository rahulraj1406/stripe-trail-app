<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Trail Challenge</title>
<style>
:root{--primary:#ff385c;--primary-active:#e00b41;--ink:#222;--body:#3f3f3f;--muted:#6a6a6a;--hair:#ddd;--soft:#f7f7f7;--r-lg:14px}
*{box-sizing:border-box}
body{margin:0;font-family:'Airbnb Cereal VF',Circular,-apple-system,system-ui,Roboto,'Helvetica Neue',sans-serif;color:var(--body);background:#fff;line-height:1.5}
header{border-bottom:1px solid var(--hair);padding:16px 24px;display:flex;align-items:center;gap:8px}
header b{color:var(--primary);font-size:20px;font-weight:700}
.hero{max-width:1080px;margin:0 auto;padding:48px 24px 24px}
.hero h1{font-size:28px;font-weight:700;color:var(--ink);margin:0 0 8px;line-height:1.3}
.hero p{margin:0;color:var(--muted);font-size:16px}
.grid{max-width:1080px;margin:0 auto;padding:24px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:#fff;border:1px solid var(--hair);border-radius:var(--r-lg);padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:20px;font-weight:600;color:var(--ink);margin:0 0 4px;letter-spacing:-.18px}
.card .sub{font-size:14px;color:var(--muted);margin:0 0 16px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:0 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--hair);border-radius:8px;margin-bottom:12px;color:var(--ink)}
input:focus{outline:2px solid var(--ink);border-color:var(--ink)}
button{width:100%;font:inherit;font-weight:600;color:#fff;background:var(--primary);border:0;border-radius:8px;padding:14px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:var(--primary-active)}button:active{transform:scale(.98)}
.price{font-size:32px;font-weight:700;color:var(--ink);margin-bottom:12px}.price small{font-size:14px;font-weight:400;color:var(--muted)}
#msg{display:block;margin-top:10px;font-size:14px;color:var(--muted);min-height:1.4em}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px 0;border-bottom:1px solid var(--hair)}
td{padding:12px 0;border-bottom:1px solid #ebebeb;color:var(--ink)}
td:last-child,th:last-child{text-align:right;font-weight:600}
.rank{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--soft);font-size:13px;font-weight:600}
tr:first-child .rank{background:var(--primary);color:#fff}
.empty{color:var(--muted);padding:16px 0}
</style></head><body>
<header><b>🏔️ trail</b><span style="color:var(--muted)">Weekly Challenge</span></header>
<div class="hero"><h1>Run more. Climb the leaderboard.</h1><p>Enter this week's trail challenge, log your kilometres, and see how you stack up.</p></div>
<main class="grid">
 <section class="card" id="joinCard"><h2>Join the challenge</h2><p class="sub">Free entry for now. Just a quick sign-in.</p>
  <label for="jname">Name</label><input id="jname" placeholder="Your name" autocomplete="name">
  <label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
  <button id="join">Enter challenge</button></section>
 <section class="card"><h2>Log a run</h2><p class="sub">Every kilometre counts</p>
  <label for="user">Name</label><input id="user" placeholder="Your name">
  <label for="km">Distance (km)</label><input id="km" type="number" step="0.1" min="0" placeholder="5.0">
  <button id="log">Record run</button><span id="msg" role="status"></span></section>
 <section class="card"><h2>Leaderboard</h2><p class="sub">Total km this season</p><table id="lb"></table></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const saved=()=>{try{return JSON.parse(localStorage.getItem('trailUser'))}catch(e){return null}};
function showJoined(u){$('joinCard').innerHTML=`<h2>You're in, ${esc(u.name)}! 🎉</h2><p class="sub">Log your runs and climb the leaderboard.</p><button id="out" style="background:#fff;color:#222;border:1px solid #ddd">Sign out</button>`;$('user').value=u.name;$('out').onclick=()=>{try{localStorage.removeItem('trailUser')}catch(e){}location.reload()}}
$('join').onclick=()=>{const name=$('jname').value.trim();if(!name){$('jname').focus();return}const u={name,email:$('email').value.trim()};try{localStorage.setItem('trailUser',JSON.stringify(u))}catch(e){}showJoined(u)};
const u0=saved();if(u0)showJoined(u0);
$('log').onclick=async()=>{const r=await post('/record-run',{user:$('user').value,distanceKm:+$('km').value});$('msg').textContent=r.message||r.error;if(r.message){$('km').value='';load()}};
async function load(){const d=await (await fetch('/leaderboard')).json();const l=d.leaderboard||[];
$('lb').innerHTML=l.length?'<tr><th>Rank</th><th>Runner</th><th>km</th></tr>'+l.map((x,i)=>`<tr><td><span class="rank">${i+1}</span></td><td>${esc(x.user)}</td><td>${x.total_km.toFixed(1)}</td></tr>`).join(''):'<tr><td class="empty">No runs yet. Be the first!</td></tr>'}
load();
</script></body></html>
